<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>格子排版变体对比</title>
<style>
  :root {
    --cell: #f4f5f7; --cell-border: #e2e3e8; --muted: #86868b; --fg: #1d1d1f;
    --accent: #2f6feb; --on-accent: #fff; --num: "Cascadia Mono", Consolas, monospace;
    --ui: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
  }
  body { margin: 0; padding: 16px; font-family: var(--ui); background: #fff; color: var(--fg); }
  h2 { font-size: 12px; font-weight: 600; color: #555; margin: 16px 0 6px; }
  .grid { display: grid; grid-template-columns: repeat(8, 39px); gap: 2px; }
  .cell {
    position: relative; display: grid; place-items: center;
    height: 32px; border: 1px solid var(--cell-border); border-radius: 4px;
    background: var(--cell); color: var(--muted); font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .no {
    font-family: var(--num); font-size: 9px; line-height: 1; opacity: .78;
    font-variant-numeric: tabular-nums; letter-spacing: -.2px;
  }

  /* A：值居中 + 位号右下 */
  .a .no { position: absolute; right: 3px; bottom: 3px; min-width: 11px; text-align: right; }

  /* B：位号上 + 值下（竖向堆叠） */
  .b .cell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .b .no { font-size: 8px; opacity: .7; }

  /* C：位号左上角 + 值居中 */
  .c .no { position: absolute; left: 3px; top: 3px; opacity: .62; }

  /* D：值左 + 位号右（同行） */
  .d .cell { display: flex; align-items: center; justify-content: space-between; padding: 0 5px 0 7px; }
  .d .no { opacity: .62; }
</style>
</head>
<body>

<h2>A · 值居中 + 位号右下（当前）</h2>
<div class="grid a"></div>

<h2>B · 位号在上、值在下（竖向堆叠）</h2>
<div class="grid b"></div>

<h2>C · 位号左上角（棋盘坐标式）</h2>
<div class="grid c"></div>

<h2>D · 值在左、位号在右（同行并列）</h2>
<div class="grid d"></div>

<script>
  const samples = [
    [63, 1], [62, 0], [61, 0], [60, 1], [59, 0], [58, 0], [57, 0], [56, 1],
    [47, 0], [46, 0], [45, 0], [44, 1], [43, 0], [42, 0], [41, 0], [40, 0],
    [12, 0], [11, 0], [10, 1], [9, 1], [8, 0], [7, 0], [6, 0], [5, 0],
  ];
  document.querySelectorAll('.grid').forEach((g) => {
    for (const [pos, v] of samples) {
      const c = document.createElement('div');
      c.className = 'cell' + (v ? ' on' : '');
      c.innerHTML = '<span class="val">' + v + '</span><span class="no">' + pos + '</span>';
      g.appendChild(c);
    }
  });
</script>
</body>
</html>
