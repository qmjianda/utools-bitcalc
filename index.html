<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>bitcalc</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">

  <svg width="0" height="0" class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-copy" viewBox="0 0 16 16"><rect x="5.2" y="5.2" width="8" height="8" rx="1.6"/><path d="M3.2 10.8V4.8a1.6 1.6 0 0 1 1.6-1.6h6"/></symbol>
    <symbol id="i-history" viewBox="0 0 16 16"><path d="M3 8a5 5 0 1 0 1.5-3.6"/><path d="M3 4v3.2h3.2"/><path d="M8 5.4V8l2 1.3"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 16 16"><path d="M2.5 4.5h11M2.5 11.5h11"/><circle cx="6" cy="4.5" r="1.6"/><circle cx="10" cy="11.5" r="1.6"/></symbol>
    <symbol id="i-fields" viewBox="0 0 16 16"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h7"/></symbol>
    <symbol id="i-more" viewBox="0 0 16 16"><circle cx="3.5" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="8" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="12.5" cy="8" r="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 16 16"><path d="M4 6.5 8 10l4-3.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9"/></symbol>
    <symbol id="i-x" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></symbol>
    <symbol id="i-edit" viewBox="0 0 16 16"><path d="M10.8 2.8l2.4 2.4L5.4 13H3v-2.4z"/><path d="M9.8 3.8l2.4 2.4"/></symbol>
    <symbol id="i-check" viewBox="0 0 16 16"><path d="M3 8.4l3.2 3.1L13 4.6"/></symbol>
    <symbol id="i-braces" viewBox="0 0 16 16"><path d="M6 2.8c-1.4 0-1.6.8-1.6 1.9v1.1c0 .8-.4 1.2-1.1 1.2.7 0 1.1.4 1.1 1.2v1.1c0 1.1.2 1.9 1.6 1.9M10 2.8c1.4 0 1.6.8 1.6 1.9v1.1c0 .8.4 1.2 1.1 1.2-.7 0-1.1.4-1.1 1.2v1.1c0 1.1-.2 1.9-1.6 1.9"/></symbol>
    <symbol id="i-undo" viewBox="0 0 16 16"><path d="M4 6.5H9a3.5 3.5 0 0 1 0 7H6"/><path d="M6.5 4 4 6.5 6.5 9"/></symbol>
    <symbol id="i-trash" viewBox="0 0 16 16"><path d="M3.5 4.5h9M6 4.5V3h4v1.5M5 4.5l.5 8h5l.5-8"/></symbol>
  </svg>

  <header class="topbar">
    <div class="expr-field">
      <span class="expr-mark" aria-hidden="true">ƒx</span>
      <input id="expr-input" class="expr-input" type="text" autocomplete="off" spellcheck="false"
             aria-label="表达式输入" placeholder="输入表达式，例如 0xFF、1<<8 | 3">
    </div>
    <div class="top-actions">
      <label class="width-btn" title="位宽">
        <span id="width-label">64</span> 位
        <select id="width-select" aria-label="位宽">
          <option value="8">8 位</option>
          <option value="16">16 位</option>
          <option value="32">32 位</option>
          <option value="64" selected>64 位</option>
        </select>
        <svg class="icon chevron" aria-hidden="true"><use href="#i-chevron"/></svg>
      </label>

      <button id="fields-btn" class="fields-btn" type="button" title="折叠或展开字段面板">
        字段 <b id="fields-count">0</b>
      </button>

      <div class="menu-wrap">
        <button id="display-btn" class="icon-btn" type="button" aria-haspopup="true" aria-expanded="false"
                title="显示设置" aria-label="显示设置">
          <svg class="icon"><use href="#i-sliders"/></svg>
        </button>
        <div id="display-menu" class="popmenu" hidden role="menu" aria-label="显示设置">
          <label class="menu-check">
            <input type="checkbox" id="signed-chk">
            <span>有符号整数</span>
          </label>
          <button id="endian-btn" class="menu-row" type="button" title="切换 HEX 字节序">
            <span>HEX 字节序</span><b>BE</b>
          </button>
        </div>
      </div>

      <button id="history-btn" class="icon-btn" type="button" aria-haspopup="true" aria-expanded="false"
              title="历史记录（Ctrl+H）" aria-label="历史记录">
        <svg class="icon"><use href="#i-history"/></svg>
      </button>

      <div class="menu-wrap">
        <button id="more-btn" class="icon-btn" type="button" aria-haspopup="true" aria-expanded="false"
                title="更多" aria-label="更多">
          <svg class="icon"><use href="#i-more"/></svg>
        </button>
        <div id="more-menu" class="popmenu" hidden role="menu" aria-label="更多">
          <button id="undo-btn" class="menu-row" type="button">
            <span>撤销</span><kbd>Ctrl Z</kbd>
          </button>
          <button id="clear-sel-btn" class="menu-row" type="button">
            <span>清除选区</span><kbd>Del</kbd>
          </button>
          <button id="copy-all-btn" class="menu-row" type="button">
            <span>复制整值</span><kbd>HEX</kbd>
          </button>
        </div>
      </div>
    </div>
  </header>

  <div class="content" id="content">
    <div class="maincol">
      <section class="valuebar" aria-label="当前值">
        <div class="primary">
          <div class="primary-head">
            <span class="eyebrow" id="eyebrow">整值 · 64 位</span>
            <div class="bases" id="base-switch" role="group" aria-label="主显示进制">
              <button type="button" data-base="hex" aria-pressed="true">HEX</button>
              <button type="button" data-base="dec" aria-pressed="false">DEC</button>
              <button type="button" data-base="oct" aria-pressed="false">OCT</button>
            </div>
            <div class="ctx-actions" id="ctx-actions" hidden>
              <button id="ctx-edit" class="ctx-btn" type="button" title="写入选区">
                <svg class="icon"><use href="#i-edit"/></svg>改值
              </button>
              <button id="ctx-clear" class="ctx-btn" type="button" title="清除选区">
                <svg class="icon"><use href="#i-x"/></svg>清除
              </button>
            </div>
          </div>
          <div class="primary-row">
            <span class="big" id="val-big" title="点击复制">0x0</span>
            <button id="copy-main" class="copy-ghost" type="button" title="复制主值" aria-label="复制主值">
              <svg class="icon"><use href="#i-copy"/></svg>
            </button>
          </div>
          <div class="sel-meta" id="sel-meta" hidden></div>
        </div>
      </section>

      <div class="workbench" id="workbench">
        <main class="stage">
          <div class="canvas" id="canvas">
            <div id="grid" tabindex="0" role="group" aria-label="位网格"></div>
          </div>
        </main>
      </div>
    </div>

    <aside class="inspector" id="inspector" aria-label="检查器" hidden>
      <div class="insp-tabs" id="insp-tabs" role="tablist" aria-label="检查器">
        <button type="button" class="insp-tab on" data-tab="fields" role="tab" aria-selected="true">
          字段 <span class="count" id="tab-fields-count">0</span>
        </button>
        <button type="button" class="insp-tab" data-tab="values" role="tab" aria-selected="false">值</button>
        <button type="button" class="insp-tab" data-tab="history" role="tab" aria-selected="false">历史</button>
      </div>

      <div class="insp-pane" id="insp-fields" role="tabpanel">
        <div class="insp-sub">
          <span id="field-summary">没有字段</span>
          <button id="add-field" class="add" type="button" title="新增字段">
            <svg class="icon"><use href="#i-plus"/></svg>
          </button>
        </div>
        <div class="flist" id="field-list" role="listbox" tabindex="0" aria-label="字段列表"></div>
        <div class="insp-foot">
          <div class="coverage">
            <div class="bar"><i id="coverage-bar"></i></div>
            <span id="coverage-text">0 / 64</span>
            <span id="overlap-text" class="ok">无重叠</span>
          </div>
          <button id="define-fields" class="insp-define" type="button">
            <svg class="icon"><use href="#i-braces"/></svg>定义字段
          </button>
        </div>
      </div>

      <div class="insp-pane" id="insp-values" role="tabpanel" hidden>
        <div class="insp-sub"><span>当前值 · 全部表示</span></div>
        <div class="value-table" id="value-table"></div>
      </div>

      <div class="insp-pane" id="insp-history" role="tabpanel" hidden>
        <div class="insp-sub">
          <span>最近 60 条</span>
          <button id="history-clear" class="text-btn" type="button">清空</button>
        </div>
        <ul class="history-list" id="history-list" role="listbox" tabindex="0" aria-label="历史记录"></ul>
        <div class="empty" id="history-empty">还没有记录。输入表达式或改字段后自动记下。</div>
      </div>
    </aside>
  </div>

  <footer class="statusbar">
    <div class="status-left">
      <span>点按翻转</span><span class="dot-sep"></span>
      <span>拖动选择</span><span class="dot-sep"></span>
      <kbd>Del</kbd><span>清除</span>
    </div>
    <div class="status-right">
      <span id="hint" role="status" aria-live="polite">点按翻转 · 拖动选择 · 输入即写回</span>
      <span class="dot-sep"></span>
      <span class="save-state" id="save-state"><svg class="icon"><use href="#i-check"/></svg>已保存</span>
    </div>
  </footer>

  <!-- 字段定义：覆盖主区的抽屉式面板，不改变窗口高度 -->
  <section class="spec" id="spec-panel" role="dialog" aria-modal="true" aria-label="字段定义" hidden>
    <div class="spec-head">
      <span class="spec-title">字段定义</span>
      <button class="mini" id="spec-sample" type="button" title="填入一段示例定义（不会动已应用的字段）">示例</button>
      <button class="mini" id="spec-help-toggle" type="button" aria-expanded="true"
              aria-controls="spec-help" title="显示或隐藏语法说明">语法</button>
      <button class="mini icon-mini" id="spec-close" type="button" title="关闭" aria-label="关闭">
        <svg class="icon"><use href="#i-x"/></svg>
      </button>
    </div>

    <div class="spec-help" id="spec-help">
      <div><code>名称 高:低</code> 指定位段，如 <code>opcode 15:12</code></div>
      <div><code>名称:位宽</code> 或 <code>名称 位宽</code> 从最高位往下顺排（<code>mode 3</code> = 占 3 位）；单比特写 <code>flag 15:15</code></div>
      <div><code>[ ]</code> 可省略空格；<code>#</code> 开头整行注释；总宽不超过 64 位</div>
    </div>

    <textarea id="spec-text" spellcheck="false" autocomplete="off"
              aria-describedby="spec-help spec-msg"
              placeholder="opcode 15:12&#10;rd 11:8&#10;rs 7:4&#10;func 3:0"></textarea>

    <div class="spec-schemes">
      <label class="sr-only" for="scheme-select">已保存的方案</label>
      <select id="scheme-select" class="select">
        <option value="">未保存的方案…</option>
      </select>
      <button class="btn" id="scheme-load" type="button" disabled title="把选中方案写入编辑框并应用">载入</button>
      <button class="btn" id="scheme-save" type="button" title="把当前定义保存为命名方案">保存为…</button>
      <button class="btn" id="scheme-del" type="button" disabled title="删除选中方案">删除</button>
    </div>

    <div class="spec-save-name" id="scheme-form" hidden>
      <label class="sr-only" for="scheme-name">方案名</label>
      <input id="scheme-name" type="text" maxlength="24" placeholder="方案名，例如 USB 请求"
             autocomplete="off">
      <button class="btn primary" id="scheme-name-ok" type="button">保存</button>
      <button class="btn" id="scheme-name-cancel" type="button">取消</button>
    </div>

    <div class="spec-actions">
      <span class="spec-msg" id="spec-msg" role="status" aria-live="polite"></span>
      <button class="btn" id="spec-cancel" type="button">取消</button>
      <button class="btn primary" id="spec-save" type="button">应用</button>
    </div>
  </section>

</div>

<script src="parser.js"></script>
<script src="grid.js"></script>
<script src="proto.js"></script>
<script src="store.js"></script>
<script src="main.js"></script>
</body>
</html>
