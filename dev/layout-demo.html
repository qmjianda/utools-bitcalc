<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>bitcalc · 布局方案</title>
<style>
/* ================= token ================= */
:root{
  --sans: ui-sans-serif, -apple-system, "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "Cascadia Mono", ui-monospace, "SF Mono", Consolas, "Roboto Mono", monospace;
  --page: #eef0f3;
  --ink: #17181a;
  --muted: #6b6c72;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--page); color:var(--ink); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
button{font:inherit;color:inherit}

/* ================= page chrome ================= */
.page-head{max-width:1240px;margin:0 auto;padding:34px 24px 6px}
.page-head h1{font-size:19px;letter-spacing:.2px;margin:0 0 6px;font-weight:650}
.page-head p{margin:0;color:#5c5e66;font-size:13px;line-height:1.7;max-width:880px}
.page-head code{font:12px var(--mono);background:#e3e6ea;border-radius:4px;padding:1px 5px}
#demo{max-width:1000px;margin:0 auto;padding:22px 24px 48px;display:grid;grid-template-columns:repeat(2,456px);gap:34px 26px}
.item{margin:0;min-width:0}
figcaption{display:flex;flex-direction:column;gap:3px;margin:10px 1px 0;font-size:12.5px;color:#55575e;line-height:1.55}
figcaption b{font-weight:600;color:#1c1d20;font-size:13px}
figcaption span{color:#71737b}
.item .frame{zoom:.6}

/* 单方案视图：占满视口，当截图用 */
body.single{background:#fff}
body.single .page-head{display:none}
body.single #demo{display:block;padding:0;max-width:none}
body.single .item{display:none}
body.single .item.active{display:block}
body.single .item[data-clone]{display:none}
body.single figcaption{display:none}
body.single .item .frame{zoom:1;border-radius:0;border-color:transparent}
body[data-v=v0].single{background:#e9eaec}
body[data-v=v1].single{background:#0e0f11}
body[data-v=v2].single{background:#fbfbfc}
body[data-v=v3].single{background:#fff}

/* ================= frame shell ================= */
.frame{
  --bg:#fff; --panel:#fff; --ink:#17181a; --muted:#6d6e75; --hair:rgba(17,18,20,.10);
  --acc:#0b63c5; --acc-soft:rgba(11,99,197,.10); --acc-wash:rgba(11,99,197,.055);
  --chip:#f1f2f4; --chip-ink:#17181a; --mono-ink:#17181a;
  position:relative; display:flex; flex-direction:column;
  width:760px; height:420px; padding:10px 12px 8px; gap:8px;
  background:var(--bg); color:var(--ink); overflow:hidden;
  border:1px solid rgba(0,0,0,.10); border-radius:12px;
  font-family:var(--sans);
}
.frame[data-theme=dark]{
  --bg:#141518; --panel:#1a1b1f; --ink:#eceef2; --muted:#8f919b; --hair:rgba(255,255,255,.10);
  --acc:#5aa2ff; --acc-soft:rgba(90,162,255,.16); --acc-wash:rgba(90,162,255,.08);
  --chip:#1f2126; --chip-ink:#eceef2; --mono-ink:#eceef2;
  border-color:rgba(255,255,255,.10);
}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}

/* 通用控件：分段 */
.seg{display:inline-flex;padding:2px;border-radius:8px;background:var(--chip);gap:2px}
.seg button{
  appearance:none;border:0;background:transparent;color:var(--muted);
  font:12px/1 var(--sans);padding:5px 9px;border-radius:6px;cursor:pointer;
}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.frame[data-theme=dark] .seg button[aria-pressed=true]{background:#2a2d33;box-shadow:none}
.seg button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}

/* 顶部栏 */
.top{display:flex;align-items:center;gap:10px;flex:none;height:30px}
.top .push{flex:1}
.mini{
  appearance:none;border:1px solid var(--hair);background:transparent;color:var(--muted);
  font:12px/1 var(--sans);padding:6px 9px;border-radius:7px;cursor:pointer;white-space:nowrap;
}
.mini:hover{color:var(--ink);border-color:var(--ink)}
.mini.on{color:var(--acc);border-color:var(--acc);background:var(--acc-soft)}
.mini.icon{padding:6px 8px}
.mini:focus-visible{outline:2px solid var(--acc);outline-offset:1px}

/* 网格与选中框 */
.gridwrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.gridwrap .grid{display:grid;gap:2px;align-content:start;grid-auto-rows:30px;width:100%}
.bit{
  appearance:none;border:0;background:transparent;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  padding:0;border-radius:6px;cursor:pointer;min-width:0;position:relative;
}
.bit .bn{font:9.5px/1 var(--mono);color:var(--muted);opacity:0;transition:opacity .12s}
.gridwrap:hover .bit .bn{opacity:.62}
.bit .bv{font:13px/1.1 var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.bit.on .bv{color:var(--ink);font-weight:600}
.bit:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.selbox,.fieldbox{position:absolute;inset:0;pointer-events:none}
.seg-rect{position:absolute;border-radius:5px}

/* 字段面板（右侧栏） */
.rail{display:flex;flex-direction:column;min-height:0;flex:0 0 252px}
.rail-head{display:flex;align-items:baseline;gap:7px;padding:0 2px 6px;font-size:12px;color:var(--muted)}
.rail-head .cnt{font:11px var(--mono);color:var(--muted)}
.rail-head .lnk{
  appearance:none;border:0;background:none;color:var(--acc);font:12px var(--sans);
  margin-left:auto;cursor:pointer;padding:2px 0;
}
.rail-head .lnk:hover{text-decoration:underline}
.rail-body{overflow:auto;min-height:0;scrollbar-width:thin}
.frow{
  appearance:none;border:0;background:transparent;width:100%;cursor:pointer;
  display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;
  padding:0 6px;height:27px;border-radius:6px;text-align:left;
}
.frow .fname{font:12.5px var(--sans);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .frange{font:10.5px var(--mono);color:var(--muted)}
.frow .fval{font:12px var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.frow:hover{background:var(--acc-wash)}
.frow[aria-selected=true]{background:var(--acc-soft)}
.frow[aria-selected=true] .fval{color:var(--acc);font-weight:600}
.frow:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}

/* 底部状态行 */
.status{display:flex;align-items:center;gap:10px;flex:none;height:18px;font-size:11.5px;color:var(--muted)}
.status .kbd{margin-left:auto;display:flex;gap:10px;color:#9a9ca4}
.status kbd{font:10px var(--mono);border:1px solid var(--hair);border-radius:4px;padding:1px 4px;color:var(--muted)}

/* 覆盖层 */
.ovl{position:absolute;z-index:9;background:var(--panel);border:1px solid var(--hair);border-radius:10px;
  box-shadow:0 12px 32px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden}
.ovl[hidden]{display:none}
.ovl .oh{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--hair);font-size:12.5px}
.ovl .oh b{font-weight:600}
.ovl .oh .x{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;margin-left:auto;font-size:14px;line-height:1}
.ovl .ob{overflow:auto;padding:6px}
.hitem{appearance:none;border:0;background:transparent;width:100%;display:flex;gap:12px;align-items:center;
  padding:7px 8px;border-radius:7px;cursor:pointer;text-align:left}
.hitem:hover{background:var(--acc-wash)}
.hitem .hexpr{font:12px var(--mono);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hitem .hval{margin-left:auto;font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.defs{inset:12px 12px auto 12px;max-height:calc(100% - 24px)}
.defs .help{font:11px/1.7 var(--sans);color:var(--muted);padding:10px 12px 0;border-bottom:1px solid var(--hair);padding-bottom:8px}
.defs .help code{font:10.5px var(--mono);background:var(--chip);border-radius:4px;padding:1px 4px;color:var(--ink)}
.defs textarea{
  flex:1 1 auto;height:132px;min-height:96px;max-height:44vh;margin:8px 12px 0;border:1px solid var(--hair);border-radius:8px;background:transparent;color:var(--ink);
  font:12px/1.65 var(--mono);padding:8px 10px;resize:none;outline:none;
}
.defs textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.defs .of{display:flex;gap:8px;justify-content:flex-end;padding:8px 12px 12px}
.btn-primary{appearance:none;border:0;background:var(--acc);color:#fff;font:12.5px var(--sans);padding:7px 14px;border-radius:7px;cursor:pointer}
.btn-ghost{appearance:none;border:1px solid var(--hair);background:transparent;color:var(--ink);font:12.5px var(--sans);padding:7px 12px;border-radius:7px;cursor:pointer}

/* ============================================================
   V0 · 现状（近似复刻：卡片叠卡片）
   ============================================================ */
.v0{padding:10px;gap:8px}
.v0 .card{background:var(--panel);border:1px solid var(--hair);border-radius:10px}
.v0 .top{height:26px}
.v0 .tabs{display:flex;gap:16px;align-items:center}
.v0 .tabs button{appearance:none;border:0;background:none;padding:0 0 3px;font:13px var(--sans);color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.v0 .tabs button[aria-pressed=true]{color:var(--ink);font-weight:600;border-bottom-color:var(--acc)}
.v0 .disp{padding:7px 12px 9px;display:flex;align-items:flex-end;gap:12px}
.v0 .disp .hintline{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.v0 .disp .big{font:26px/1.1 var(--sans);font-weight:650;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.v0 .disp .hex{margin-left:auto;font:14px var(--mono);color:var(--muted)}
.v0 .stage{display:flex;gap:10px;flex:1;min-height:0}
.v0 .grid-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.v0 .bit{background:var(--chip);gap:0;border-radius:5px}
.v0 .bit.on{background:var(--acc)}
.v0 .bit.on .bv{color:#fff}
.v0 .bit .bv{font-size:12.5px;color:var(--ink)}
.v0 .bit .bn{position:absolute;left:3px;top:2px}
.v0 .fields{width:236px}
.v0 .readout .r{display:flex;justify-content:space-between;padding:4px 12px;font:12px var(--mono)}
.v0 .readout .r+.r{border-top:1px solid var(--hair)}
.v0 .readout .lbl{color:var(--muted);font:11px var(--sans);letter-spacing:.4px}
.v0 .fields-head{padding:6px 10px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.v0 .frow{grid-template-columns:1fr auto auto;height:24px;border-radius:0;border-top:1px solid var(--hair)}
.v0 .frow .fname{font-size:12px}

/* ============================================================
   V1 · 仪表盘（深色控制台）
   ============================================================ */
.v1{padding:12px 14px 10px;gap:9px;--chartreuse:#cfe36b}
.v1 .top{height:26px;gap:14px}
.v1 .modes{display:flex;gap:16px}
.v1 .modes button{
  appearance:none;border:0;background:none;padding:0 0 2px;cursor:pointer;
  font:10px/1 var(--mono);letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);
  border-bottom:1.5px solid transparent;
}
.v1 .modes button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--acc)}
.v1 .top .lab{font:9.5px/1 var(--mono);letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-right:-4px}
.v1 .val{display:flex;align-items:flex-start;gap:18px;flex:none;padding:14px 2px 12px;border-bottom:1px solid var(--hair)}
.v1 .val .main{min-width:0}
.v1 .val .cap{font:9.5px/1 var(--mono);letter-spacing:1.4px;color:var(--muted);text-transform:uppercase;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.v1 .val .cap .chip{font:9.5px var(--mono);letter-spacing:.6px;color:var(--acc);border:1px solid var(--acc);border-radius:4px;padding:2px 5px}
.v1 .val .big{font:38px/1 var(--mono);font-weight:500;letter-spacing:-1px;font-variant-numeric:tabular-nums;color:var(--ink)}
.v1 .val .kvs{margin-left:auto;display:grid;grid-template-columns:auto auto;gap:6px 16px;align-content:start;padding-top:2px}
.v1 .kv{display:flex;align-items:baseline;gap:10px}
.v1 .kv .k{font:9.5px/1 var(--mono);letter-spacing:1.2px;color:var(--muted)}
.v1 .kv .v{font:12px/1 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.v1 .binrow{font:11px/1 var(--mono);color:var(--muted);letter-spacing:.6px;flex:none;padding:7px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v1 .stage{display:flex;gap:14px;flex:1;min-height:0}
.v1 .grid-wrap{flex:1;min-width:0}
.v1 .bit{background:#1e2024;border-radius:6px;gap:1px;border:1px solid rgba(255,255,255,.035)}
.v1 .bit .bv{color:#7f828b;font-size:12.5px}
.v1 .bit.on{background:var(--acc);border-color:transparent}
.v1 .bit.on .bv{color:#0b1523;font-weight:700}
.v1 .bit.nib{background:#282b31}
.v1 .bit.sel:not(.on){background:var(--acc-soft)}
.v1 .bit.sel.on{background:#7cb4ff}
.v1 .fields{width:244px;border-left:1px solid var(--hair);padding-left:12px}
.v1 .frow{height:26px;border-radius:5px}
.v1 .frow .fname{font:12px var(--mono);letter-spacing:.2px}
.v1 .frow .frange{font-size:10px}
.v1 .frow:hover{background:rgba(255,255,255,.05)}
.v1 .frow[aria-selected=true]{background:var(--acc-soft)}
.v1 .status{height:16px;font:9.5px/1 var(--mono);letter-spacing:1.2px;text-transform:uppercase}

/* ============================================================
   V2 · 分栏（文档感，右侧表格）
   ============================================================ */
.v2{padding:12px 14px 10px;gap:10px;--panel2:#fff}
.v2 .top{height:28px;gap:8px}
.v2 .modes{display:flex;gap:2px;padding:2px;border:1px solid var(--hair);border-radius:8px}
.v2 .modes button{appearance:none;border:0;background:none;padding:6px 11px;border-radius:6px;font:12.5px var(--sans);color:var(--muted);cursor:pointer}
.v2 .modes button[aria-pressed=true]{background:#eef3fa;color:var(--acc);font-weight:600}
.v2 .body{display:flex;gap:16px;flex:1;min-height:0}
.v2 .left{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.v2 .val{padding:2px 0 10px;border-bottom:1px solid var(--hair);display:flex;align-items:flex-end;gap:14px}
.v2 .val .cap{font-size:10.5px;letter-spacing:.8px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.v2 .val .big{font:34px/1 var(--mono);letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.v2 .val .side{margin-left:auto;text-align:right;display:flex;flex-direction:column;gap:4px}
.v2 .val .side .h{font:12px var(--mono);color:var(--ink)}
.v2 .val .side .s{font:10.5px var(--mono);color:var(--muted)}
.v2 .bit{background:transparent;border-radius:4px}
.v2 .bit .bv{font-size:12.5px;color:#7d7e85}
.v2 .bit.on .bv{color:var(--acc);font-weight:700}
.v2 .bit.nib{background:rgba(11,99,197,.05)}
.v2 .bit.sel{background:rgba(11,99,197,.10)}
.v2 .seg-rect{border-left:3px solid var(--acc);background:rgba(11,99,197,.07)}
.v2 .seg-rect::before,.v2 .seg-rect::after{content:"";position:absolute;left:0;right:0;height:1px;background:var(--acc)}
.v2 .seg-rect::before{top:0}.v2 .seg-rect::after{bottom:0}
.v2 .rail{flex:0 0 258px;border-left:1px solid var(--hair);padding-left:14px}
.v2 .rail-head{font:10.5px var(--sans);letter-spacing:1px;text-transform:uppercase;padding-bottom:8px;border-bottom:1px solid var(--hair)}
.v2 .frow{height:26px;border-radius:0;border-bottom:1px solid var(--hair);padding:0 2px}
.v2 .frow .fname{font-size:12.5px}
.v2 .frow:hover{background:var(--acc-wash)}
.v2 .frow[aria-selected=true]{background:var(--acc-wash)}
.v2 .status{height:16px;font-size:11px}

/* ============================================================
   V3 · 极简（无卡片，排印 + 细线）
   ============================================================ */
.v3{padding:14px 18px 10px;gap:12px}
.v3 .top{height:24px;gap:18px}
.v3 .modes{display:flex;gap:18px}
.v3 .modes button{
  appearance:none;border:0;background:none;padding:0 0 4px;cursor:pointer;
  font:12.5px var(--sans);color:var(--muted);border-bottom:2px solid transparent;
}
.v3 .modes button[aria-pressed=true]{color:var(--ink);font-weight:600;border-bottom-color:var(--acc)}
.v3 .wbtn{
  appearance:none;border:0;background:none;padding:4px 7px;border-radius:5px;cursor:pointer;
  font:11.5px var(--mono);color:var(--muted);
}
.v3 .wbtn[aria-pressed=true]{color:var(--ink);background:var(--chip);font-weight:700}
.v3 .ghost{
  appearance:none;border:0;background:none;padding:4px 7px;border-radius:5px;cursor:pointer;
  font:11.5px var(--sans);color:var(--muted);
}
.v3 .ghost:hover{color:var(--ink)}
.v3 .ghost[aria-pressed=true]{color:var(--acc);background:var(--acc-soft)}
.v3 .val{display:flex;align-items:flex-end;gap:16px;flex:none;padding:2px 0 10px;border-bottom:1px solid var(--hair)}
.v3 .val .main{min-width:0}
.v3 .val .big{font:46px/1 var(--mono);letter-spacing:-1.6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.v3 .val .bases{display:flex;gap:2px;margin-top:7px}
.v3 .val .bases button{
  appearance:none;border:0;background:none;padding:3px 6px;border-radius:5px;cursor:pointer;
  font:10px/1 var(--mono);letter-spacing:1.1px;color:var(--muted);
}
.v3 .val .bases button[aria-pressed=true]{color:var(--acc);background:var(--acc-soft);font-weight:700}
.v3 .val .side{margin-left:auto;display:flex;flex-direction:column;gap:5px;text-align:right}
.v3 .val .side .row{display:flex;gap:10px;align-items:baseline;justify-content:flex-end}
.v3 .val .side .k{font:9.5px/1 var(--mono);letter-spacing:1.2px;color:var(--muted)}
.v3 .val .side .v{font:12.5px/1 var(--mono);font-variant-numeric:tabular-nums}
.v3 .stage{display:flex;gap:20px;flex:1;min-height:0}
.v3 .grid-wrap{flex:1;min-width:0;display:flex;align-items:center}
.v3 .grid{width:100%;gap:1px 2px}
.v3 .bit{border-radius:4px}
.v3 .bit .bn{font-size:9px;opacity:.5}
.v3 .bit:hover .bn,.v3 .bit.on .bn{opacity:1}
.v3 .bit .bv{font-size:14px;color:#bcbdc4}
.v3 .bit.on .bv{color:var(--ink);font-weight:700}
.v3 .bit.nib:not(.sel) .bv{color:var(--ink);opacity:.55}
.v3 .bit.sel{background:var(--acc-wash)}
.v3 .bit[data-bx]::after{content:"";position:absolute;right:-2px;top:7px;bottom:7px;width:1px;background:var(--hair)}
.v3 .fields .rail-head{border-bottom:1px solid var(--hair);padding-bottom:8px;margin-bottom:3px}
.v3 .seq-rect,.v3 .seg-rect{background:none;border-top:1.5px solid var(--acc);border-bottom:1.5px solid var(--acc)}
.v3 .seg-rect::before,.v3 .seg-rect::after{content:"";position:absolute;top:0;bottom:0;width:1.5px;background:var(--acc)}
.v3 .seg-rect::before{left:0}.v3 .seg-rect::after{right:0}
.v3 .fields{flex:0 0 240px;padding-left:16px;border-left:1px solid var(--hair)}
.v3 .rail-head{font-size:11px}
.v3 .frow{height:25px;border-radius:4px;padding:0 6px}
.v3 .frow .fname{font:12px var(--mono)}
.v3 .frow .frange{font-size:10px}
.v3 .frow:hover{background:var(--acc-wash)}
.v3 .frow[aria-selected=true]{background:var(--acc-soft)}
.v3 .status{height:16px;font-size:11px}
.v3 .status .kbd{gap:12px}

/* ================= V4 · 位 / 值 左右分割，字段在下方 ================= */
.v4 .top{display:flex;align-items:center;gap:5px;height:40px;padding:0 2px;border-bottom:1px solid var(--hair)}
.v4 .modes{display:flex;gap:0}
.v4 .modes button{
  appearance:none;border:0;background:none;cursor:pointer;padding:9px 2px;margin-right:16px;
  font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;
}

<script>
(function () {
  'use strict';

  var DEFAULT_SPEC = 'opcode 31:28\nrd 27:24\nrs 23:20\nfunc 19:16\nflag 15:15\ncnt 14:12\nrsvd 11:0';
  var HISTORY = [
    { expr: '0xA5C3F0D2', val: 0xA5C3F0D2n, width: 32 },
    { expr: 'popcount(0xFF)', val: 8n, width: 32 },
    { expr: '1 << 20', val: 1048576n, width: 32 },
    { expr: '0xFF ^ 0x0F', val: 240n, width: 32 }
  ];

  /* ---------- 数据格式 ---------- */
  function groupHex(hex) {
    return hex.replace(/(.{4})(?=.)/g, '$1 ');
  }
  function commas(s) { return s.replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function hexOf(v, w) {
    var digits = Math.max(1, Math.ceil(w / 4));
    return '0x' + groupHex(v.toString(16).toUpperCase().padStart(digits, '0'));
  }
  function binOf(v, w) {
    var s = v.toString(2).padStart(w, '0');
    return s.replace(/(.{4})(?=.)/g, '$1 ');
  }
  function octOf(v, w) {
    var digits = Math.max(1, Math.ceil(w / 3));
    return '0' + v.toString(8).padStart(digits, '0');
  }
  function decOf(v, w, signed) {
    var signBit = 1n << BigInt(w - 1);
    var n = v;
    if (signed && (v & signBit)) n = v - (1n << BigInt(w));
    return commas(n.toString());
  }
  function floatOf(v, w) {
    try {
      if (w >= 64) {
        var buf = new ArrayBuffer(8), dv = new DataView(buf);
        dv.setBigUint64(0, BigInt.asUintN(64, v), false);
        return trimFloat(dv.getFloat64(0, false));
      }
      if (w >= 32) {
        var b4 = new ArrayBuffer(4), d4 = new DataView(b4);
        d4.setUint32(0, Number(v & 0xFFFFFFFFn), false);
        return trimFloat(d4.getFloat32(0, false));
      }
    } catch (e) { /* 忽略 */ }
    return '';
  }
  function trimFloat(n) {
    if (n !== n) return 'NaN';
    if (!isFinite(n)) return n > 0 ? '∞' : '−∞';
    if (n === 0) return '0';
    var a = Math.abs(n);
    if (a >= 1e5 || a < 1e-4) {
      return n.toExponential(5).replace('e', 'e').replace('-', '−');
    }
    return String(+n.toFixed(6));
  }
  function rangeOf(a, b) { return a <= b ? { start: a, end: b } : { start: b, end: a }; }
  function extract(v, start, end) {
    var w = end - start + 1;
    return (v >> BigInt(start)) & ((1n << BigInt(w)) - 1n);
  }

  /* ---------- 字段定义解析（demo 用简化版） ---------- */
  function parseSpec(text, width) {
    var fields = [], cursor = width - 1, err = '';
    text.split(/\r?\n/).forEach(function (raw, i) {
      var line = raw.split('#')[0].trim();
      if (!line) return;
      var m = line.match(/^([^\s\[\]:]+)\s*\[\s*(\d+)\s*:\s*(\d+)\s*\]$/);
      if (m) { fields.push({ name: m[1], start: Math.min(+m[2], +m[3]), end: Math.max(+m[2], +m[3]) }); return; }
      m = line.match(/^([^\s\[\]:]+)\s+(\d+)\s*:\s*(\d+)$/);
      if (m) { fields.push({ name: m[1], start: Math.min(+m[2], +m[3]), end: Math.max(+m[2], +m[3]) }); return; }
      m = line.match(/^([^\s\[\]:]+)\s*:\s*(\d+)$/);
      if (m) { fields.push(byWidth(m[1], +m[2])); return; }
      m = line.match(/^([^\s\[\]:]+)\s+(\d+)$/);
      if (m) { fields.push(byWidth(m[1], +m[2])); return; }
      err = err || ('第 ' + (i + 1) + ' 行无法识别：' + line);
    });
    function byWidth(name, w) {
      var end = cursor, start = end - w + 1;
      cursor = start - 1;
      return { name: name, start: start, end: end };
    }
    return { fields: fields, err: err };
  }

  /* ---------- 每个 frame 一份状态 ---------- */
  var INIT_SEL = (function () {
    var m = /[?&]sel=(\d+)-(\d+)/.exec(location.search);
    return m ? [+m[1], +m[2]] : null;
  })();
  var INIT_OPEN = (function () {
    var m = /[?&]open=(history|defs)/.exec(location.search);
    return m ? m[1] : null;
  })();

  function initFrame(frame) {
    var st = frame.__st = {
      width: 64, mode: 'proto', value: 0xA5C3F0D2n, signed: false, le: false,
      base: 'dec', sel: null, hover: null, hoverField: -1, drag: null,
      fields: parseSpec(DEFAULT_SPEC, 32).fields, defsText: DEFAULT_SPEC
    };
    frame.__defs = parseSpec(DEFAULT_SPEC, 32);

    frame.addEventListener('click', function (e) {
      var el = e.target.closest('[data-act]');
      if (el && frame.contains(el)) { act(frame, el, e); }
    });
    frame.addEventListener('input', function (e) {
      if (e.target.matches('[data-role=defs-input]')) { frame.__defsText = e.target.value; }
    });

    var grid = frame.querySelector('[data-role=grid]');
    grid.addEventListener('pointerdown', function (e) {
      var cell = e.target.closest('.bit');
      if (!cell) return;
      e.preventDefault();
      grid.setPointerCapture(e.pointerId);
      st.drag = { start: +cell.dataset.pos, moved: false, x: e.clientX, y: e.clientY };
    });
    grid.addEventListener('pointermove', function (e) {
      // 指针被 setPointerCapture 抓走时 e.target 是 grid 本身，命中测试要回到坐标上
      var cell = e.target.closest('.bit') ||
        (document.elementFromPoint(e.clientX, e.clientY) || document.body).closest('.bit');
      if (st.drag) {
        var dx = Math.abs(e.clientX - st.drag.x), dy = Math.abs(e.clientY - st.drag.y);
        if (dx + dy > 4) st.drag.moved = true;
        if (st.drag.moved && cell) {
          var r = rangeOf(st.drag.start, +cell.dataset.pos);
          if (!st.sel || st.sel.start !== r.start || st.sel.end !== r.end) { st.sel = r; paint(frame); }
        }
        return;
      }
      if (cell) { hoverPos(frame, +cell.dataset.pos); }
    });
    grid.addEventListener('pointerup', function (e) {
      if (!st.drag) return;
      var d = st.drag; st.drag = null;
      if (!d.moved) toggleBit(frame, d.start);
      paint(frame);
    });
    grid.addEventListener('pointerleave', function () { hoverPos(frame, null); });

    var list = frame.querySelector('[data-role=fieldlist]');
    if (list) {
      list.addEventListener('pointerover', function (e) {
        var row = e.target.closest('.frow');
        if (!row) return;
        st.hoverField = +row.dataset.i;
        paint(frame);
      });
      list.addEventListener('pointerleave', function () { st.hoverField = -1; paint(frame); });
      list.addEventListener('click', function (e) {
        var row = e.target.closest('.frow');
        if (!row) return;
        var f = st.fields[+row.dataset.i];
        if (!f) return;
        st.sel = { start: f.start, end: f.end };
        paint(frame);
      });
    }

    build(frame);
    if (INIT_SEL) { st.sel = rangeOf(INIT_SEL[0], INIT_SEL[1]); paint(frame); }
    if (INIT_OPEN) {
      var btn = frame.querySelector('[data-act="' + INIT_OPEN + '"]');
      if (btn) act(frame, btn, {});
    }
  }

  function act(frame, el, e) {
    var st = frame.__st, kind = el.dataset.act;
    if (kind === 'mode') { st.mode = el.dataset.mode; }
    else if (kind === 'width') { st.width = +el.dataset.w; st.sel = null; build(frame); }
    else if (kind === 'signed') { st.signed = !st.signed; }
    else if (kind === 'endian') { st.le = !st.le; }
    else if (kind === 'clear') { st.sel = null; }
    else if (kind === 'base') { st.base = el.dataset.base; }
    else if (kind === 'history') { toggle(frame, 'history', !isOpen(frame, 'history')); }
    else if (kind === 'close-history') { toggle(frame, 'history', false); }
    else if (kind === 'defs') { openDefs(frame); }
    else if (kind === 'close-defs') { toggle(frame, 'defs', false); }
    else if (kind === 'apply-defs') {
      var text = frame.querySelector('[data-role=defs-input]').value;
      var res = parseSpec(text, st.width);
      if (res.err) { setStatus(frame, res.err, true); return; }
      st.fields = res.fields; st.defsText = text; st.sel = null;
      toggle(frame, 'defs', false); build(frame);
    }
    else if (kind === 'hist') {
      var v = BigInt(el.dataset.val);
      st.value = v; st.sel = null; toggle(frame, 'history', false);
    }
    paint(frame);
  }

  function isOpen(frame, role) {
    var el = frame.querySelector('[data-role=' + role + ']');
    return el && !el.hidden;
  }
  function toggle(frame, role, on) {
    var el = frame.querySelector('[data-role=' + role + ']');
    if (el) el.hidden = !on;
    if (role === 'history') {
      var btn = frame.querySelector('[data-act=history]');
      if (btn) btn.setAttribute('aria-pressed', String(!!on));
    }
    if (role === 'defs' && on) {
      var ta = frame.querySelector('[data-role=defs-input]');
      ta.value = frame.__st.defsText;
      ta.scrollTop = 0;
      setTimeout(function () { ta.focus(); ta.scrollTop = 0; }, 30);
    }
  }
  function openDefs(frame) { toggle(frame, 'defs', true); }

  function setStatus(frame, text, warn) {
    var s = frame.querySelector('[data-role=status]');
    if (!s) return;
    s.textContent = text;
    s.style.color = warn ? '#b45309' : '';
  }

  function toggleBit(frame, pos) {
    var st = frame.__st;
    st.value = (st.value ^ (1n << BigInt(pos))) & ((1n << BigInt(st.width)) - 1n);
    if (st.sel && (pos < st.sel.start || pos > st.sel.end)) st.sel = null;
  }

  /* ---------- 构建 ---------- */
  function build(frame) {
    var st = frame.__st;
    var grid = frame.querySelector('[data-role=grid]');
    var cols = Math.min(16, st.width);
    var rows = Math.ceil(st.width / cols);
    grid.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0,1fr))';
    grid.style.gridAutoRows = '30px';
    var html = '';
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var pos = st.width - 1 - (r * cols + c);
        if (pos < 0) continue;
        html += '<button class="bit" data-pos="' + pos + '"' + (c === 7 ? ' data-bx="1"' : '') +
          ' aria-pressed="false" tabindex="-1">' +
          '<span class="bn">' + pos + '</span><span class="bv">0</span></button>';
      }
    }
    grid.innerHTML = html;

    // 字段表
    var list = frame.querySelector('[data-role=fieldlist]');
    if (list) {
      list.innerHTML = st.fields.map(function (f, i) {
        return '<button class="frow" data-i="' + i + '" aria-selected="false">' +
          '<span class="fname">' + esc(f.name) + '</span>' +
          '<span class="frange">' + (f.end === f.start ? f.end : f.end + ':' + f.start) + '</span>' +
          '<span class="fval">0x0</span></button>';
      }).join('');
    }

    // 历史
    var hist = frame.querySelector('[data-role=histlist]');
    if (hist) {
      hist.innerHTML = HISTORY.map(function (h) {
        return '<button class="hitem" data-act="hist" data-val="' + h.val + '">' +
          '<span class="hexpr">' + esc(h.expr) + '</span>' +
          '<span class="hval">= ' + commas(h.val.toString()) + '</span></button>';
      }).join('');
    }

    paint(frame);
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
    });
  }

  function hoverPos(frame, pos) {
    var st = frame.__st;
    if (st.drag) return;
    if (st.hover === pos) return;
    st.hover = pos;
    paint(frame);
  }

  /* ---------- 渲染 ---------- */
  function paint(frame) {
    var st = frame.__st;
    var v = st.value & ((1n << BigInt(st.width)) - 1n);

    // 顶部状态
    frame.querySelectorAll('[data-act=mode]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.mode === st.mode));
    });
    frame.querySelectorAll('[data-act=width]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(+b.dataset.w === st.width));
    });
    frame.querySelectorAll('[data-act=signed]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(st.signed));
      if (b.textContent.indexOf('±') >= 0) b.textContent = st.signed ? '±signed' : '±unsigned';
    });
    frame.querySelectorAll('[data-act=endian]').forEach(function (b) {
      b.textContent = st.le ? 'LE' : 'BE';
      b.setAttribute('aria-pressed', String(st.le));
    });
    frame.querySelectorAll('[data-act=base]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.base === st.base));
    });

    // 模式可见性
    frame.querySelectorAll('[data-when]').forEach(function (el) {
      el.hidden = el.dataset.when !== st.mode;
    });

    // 大数
    var bigText = st.base === 'hex' ? hexOf(v, st.width) : decOf(v, st.width, st.signed);
    var big = frame.querySelector('[data-role=big]');
    if (big) big.textContent = bigText;

    var chip = frame.querySelector('[data-role=selchip]');
    if (chip) {
      chip.hidden = !st.sel;
      if (st.sel) chip.textContent = st.sel.end === st.sel.start ? String(st.sel.end) : st.sel.end + ':' + st.sel.start;
    }

    // 各进制
    kv(frame, 'hex', hexOf(v, st.width));
    kv(frame, 'oct', octOf(v, st.width));
    kv(frame, 'bin', binOf(v, st.width));
    var fv = st.width >= 32 ? floatOf(v, st.width) : '';
    kv(frame, 'f32', fv || '—');
    kv(frame, 'dec', decOf(v, st.width, st.signed));
    kv(frame, 'fcount', String(st.fields.length));

    // 选中值
    var selOut = '—';
    if (st.sel) {
      var sw = st.sel.end - st.sel.start + 1;
      selOut = hexOf(extract(v, st.sel.start, st.sel.end), sw);
    }
    kv(frame, 'sel', selOut);

    // 网格
    var cells = frame.querySelectorAll('.bit');
    var hoverNib = st.hover != null ? Math.floor(st.hover / 4) : -1;
    cells.forEach(function (cell) {
      var pos = +cell.dataset.pos;
      var on = ((v >> BigInt(pos)) & 1n) === 1n;
      cell.setAttribute('aria-pressed', String(on));
      cell.classList.toggle('on', on);
      var inSel = st.sel && pos >= st.sel.start && pos <= st.sel.end;
      cell.classList.toggle('sel', !!inSel);
      var nib = hoverNib >= 0 && Math.floor(pos / 4) === hoverNib && !inSel;
      cell.classList.toggle('nib', nib);
      cell.querySelector('.bv').textContent = on ? '1' : '0';
    });

    // 选中框
    var box = frame.querySelector('[data-role=selbox]');
    if (box) {
      box.innerHTML = '';
      if (st.sel) {
        segments(frame, st.sel, 'sel-rect').forEach(function (r) {
          var d = document.createElement('div');
          d.className = 'seg-rect ' + r.cls;
          d.style.left = r.x + 'px'; d.style.top = r.y + 'px';
          d.style.width = r.w + 'px'; d.style.height = r.h + 'px';
          box.appendChild(d);
        });
      }
    }

    // 字段悬停框
    var fbox = frame.querySelector('[data-role=fieldbox]');
    if (fbox) {
      fbox.innerHTML = '';
      var hf = st.fields[st.hoverField];
      if (hf && st.mode === 'proto') {
        segments(frame, { start: hf.start, end: hf.end }, 'field-rect').forEach(function (r) {
          var d = document.createElement('div');
          d.className = 'seg-rect';
          d.style.left = r.x + 'px'; d.style.top = r.y + 'px';
          d.style.width = r.w + 'px'; d.style.height = r.h + 'px';
          d.style.border = '1px dashed ' + 'var(--acc)';
          d.style.opacity = '.55';
          fbox.appendChild(d);
        });
      }
    }

    // 字段行
    frame.querySelectorAll('.frow').forEach(function (row) {
      var f = st.fields[+row.dataset.i];
      if (!f) return;
      var w = f.end - f.start + 1;
      row.querySelector('.fval').textContent = hexOf(extract(v, f.start, f.end), w);
      row.setAttribute('aria-selected',
        String(!!st.sel && st.sel.start === f.start && st.sel.end === f.end));
    });

    // 状态文案
    if (st.sel) {
      var w2 = st.sel.end - st.sel.start + 1;
      setStatus(frame, '位 ' + st.sel.start + '–' + st.sel.end + ' · ' + w2 + ' 位 · ' +
        hexOf(extract(v, st.sel.start, st.sel.end), w2) + ' · 输入即写回');
    } else if (st.hover != null) {
      setStatus(frame, '位 ' + st.hover + ' · 该组 ' + hexOf(extract(v, Math.floor(st.hover / 4) * 4, Math.floor(st.hover / 4) * 4 + 3), 4) + ' · 点击翻转');
    } else if (st.mode === 'proto') {
      setStatus(frame, st.fields.length ? '点字段行选中位域 · 双击复制字段值' : '还没有字段，点「定义…」开始');
    } else {
      setStatus(frame, '拖选位域后可输入数值写回 · 点格子翻转');
    }
  }

  function kv(frame, key, text) {
    frame.querySelectorAll('[data-k=' + key + ']').forEach(function (el) { el.textContent = text; });
  }

  // 按行切段：跨行选区 → 每行一个矩形，避免出现包住整块的大框
  function segments(frame, range, cls) {
    var gridBox = frame.querySelector('[data-role=grid]').getBoundingClientRect();
    var byRow = {};
    frame.querySelectorAll('.bit').forEach(function (cell) {
      var pos = +cell.dataset.pos;
      if (pos < range.start || pos > range.end) return;
      var r = cell.getBoundingClientRect();
      var rowKey = Math.round((r.top - gridBox.top) / (r.height + 2));
      if (!byRow[rowKey]) byRow[rowKey] = { minX: 1e9, maxX: -1e9, y: r.top - gridBox.top, h: r.height };
      var b = byRow[rowKey];
      b.minX = Math.min(b.minX, r.left - gridBox.left);
      b.maxX = Math.max(b.maxX, r.right - gridBox.left);
    });
    return Object.keys(byRow).map(function (k) {
      var b = byRow[k];
      return { x: b.minX - 1, y: b.y - 1, w: b.maxX - b.minX + 2, h: b.h + 2, cls: cls };
    });
  }

  /* ---------- 启动 ---------- */
  var params = new URLSearchParams(location.search);
  var single = params.get('v');
  if (single) {
    document.body.classList.add('single');
    document.body.dataset.v = single;
    var items = document.querySelectorAll('#demo .item');
    items.forEach(function (it) {
      var fr = it.querySelector('.frame');
      var name = fr.getAttribute('data-variant');
      if (name === single) it.classList.add('active');
    });
    var dark = params.get('theme') === 'dark';
    if (dark) document.querySelectorAll('#demo .item.active .frame').forEach(function (f) { f.setAttribute('data-theme', 'dark'); });
  }

  // 克隆 V3 / V5 做深色对照：先就位再初始化，保证查询到的都是自己那份 DOM
  ['v3', 'v5'].forEach(function (name) {
    var cloneWrap = document.querySelector('[data-clone=' + name + ']');
    var src = document.querySelector('.v' + name.slice(1));
    if (cloneWrap && src) cloneWrap.querySelector('.frame').innerHTML = src.innerHTML;
  });

  document.querySelectorAll('.frame').forEach(initFrame);
})();
</script>
</body>
</html>
