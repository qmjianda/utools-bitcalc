<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>bitcalc</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <!-- 顶栏只放「现在在干什么」和「全局开关」：模式、位宽、符号、字节序、历史、清除 -->
  <header class="bar">
    <div class="modes" id="mode-tabs" role="tablist" aria-label="模式">
      <button type="button" role="tab" data-mode="bits" aria-pressed="true">位计算</button>
      <button type="button" role="tab" data-mode="proto" aria-pressed="false">协议解析</button>
    </div>

    <div class="bar-tail">
      <div class="wseg" id="width-seg" role="group" aria-label="位宽">
        <button type="button" data-w="8" title="按 8 位看">8</button>
        <button type="button" data-w="16" title="按 16 位看">16</button>
        <button type="button" data-w="32" title="按 32 位看">32</button>
        <button type="button" data-w="64" title="按 64 位看" aria-pressed="true">64</button>
      </div>
      <span class="vr" aria-hidden="true"></span>
      <label class="chk" for="signed-chk" title="按有符号整数解读（最高位为符号位）">
        <input type="checkbox" id="signed-chk">
        <span class="box" aria-hidden="true"></span>
        <span class="lbl">有符号</span>
      </label>
      <button id="endian-btn" class="ghost" type="button" title="切换 HEX 字节序（BE/LE）">BE</button>
      <button id="history-btn" class="ghost icon" type="button" aria-haspopup="dialog" aria-expanded="false"
              aria-controls="history-panel" title="历史记录（Ctrl+H）" aria-label="历史记录">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false">
          <circle cx="8" cy="8" r="5.2" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <path d="M8 4.9v3.3l2.2 1.3" fill="none" stroke="currentColor" stroke-width="1.4"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="clear-btn" class="ghost" type="button" title="清除选区（Esc）">清除</button>
    </div>
  </header>

  <!-- 左边是位，右边是值。两栏同高，位少的时候位网格在栏内垂直居中，不塌在顶部 -->
  <div class="split">
    <div class="stage" id="stage">
      <div id="grid"></div>
    </div>

    <section class="value" aria-label="当前值">
      <div class="disp-main">
        <span class="disp-val" id="val-dec" title="点击复制">0</span>
      </div>
      <div class="bases" id="base-switch" role="group" aria-label="主数字进制">
        <button type="button" data-base="dec" aria-pressed="true" title="十进制">DEC</button>
        <button type="button" data-base="hex" aria-pressed="false" title="十六进制">HEX</button>
        <button type="button" data-base="oct" aria-pressed="false" title="八进制">OCT</button>
      </div>

      <!-- 次要表示：一眼对照、点一下复制。BIN 已由位网格表达，不再重复占行 -->
      <div class="readouts" id="readouts">
        <div class="row" data-base="hex" title="点击复制 HEX">
          <span class="row-k">HEX</span>
          <span class="row-v" id="val-hex"></span>
        </div>
        <div class="row" data-base="oct" title="点击复制 OCT">
          <span class="row-k">OCT</span>
          <span class="row-v" id="val-oct"></span>
        </div>
        <div class="row" data-base="float" id="row-float" title="点击复制浮点值">
          <span class="row-k" id="float-name">F64</span>
          <span class="row-v" id="val-float"></span>
        </div>
      </div>
    </section>
  </div>

  <!-- 协议字段：横向排开的胶囊，7 个字段两行放得下；字段多时纵向滚动 -->
  <section class="fields" id="field-panel" hidden aria-label="协议字段">
    <div class="fields-head">
      <span class="fields-title">协议字段</span>
      <span class="fields-count" id="field-count"></span>
      <button class="mini" id="field-edit-btn" type="button" title="编辑字段定义">定义…</button>
    </div>
    <div class="field-body" id="field-body" role="listbox" tabindex="0" aria-label="字段列表"></div>
  </section>

  <!-- 状态行：所有操作反馈都落在这里，不用会盖住内容的浮层 -->
  <footer class="status">
    <span class="hint" id="hint" role="status" aria-live="polite">点击翻转位 · 拖动选位域</span>
    <button class="field-chip" id="field-chip" type="button" hidden title="点击清除位域选择"></button>
    <span class="keys" aria-hidden="true"><kbd>Ctrl</kbd><kbd>Z</kbd> 撤销 · <kbd>Esc</kbd> 清除</span>
  </footer>

  <!-- 历史记录：点顶栏时钟图标 / Ctrl+H 打开，Esc 关闭 -->
  <div class="popover history" id="history-panel" role="dialog" aria-modal="false"
       aria-label="历史记录" hidden>
    <div class="pop-head">
      <span class="pop-title">历史记录</span>
      <span class="pop-hint">↑↓ 选择 · Enter 恢复</span>
      <button class="mini" id="history-clear" type="button">清空</button>
    </div>
    <ul class="history-list" id="history-list" role="listbox" tabindex="0"
        aria-label="历史记录列表"></ul>
    <div class="pop-empty" id="history-empty">还没有记录。输入表达式或点格子后自动记下。</div>
  </div>

  <!-- 字段定义编辑器（协议解析模式点「定义…」打开） -->
  <div class="spec" id="spec-panel" role="dialog" aria-label="字段定义" hidden>
    <div class="spec-head">
      <span class="spec-title">字段定义</span>
      <button class="mini" id="spec-sample" type="button" title="填入一段示例定义（不会动已应用的字段）">示例</button>
      <button class="mini" id="spec-help-toggle" type="button" aria-expanded="true"
              aria-controls="spec-help" title="显示或隐藏语法说明">语法</button>
    </div>

    <!-- 常驻语法帮助：不再只写在 placeholder 里（一打字就消失） -->
    <div class="spec-help" id="spec-help">
      <div><code>名称 高:低</code> 指定位段，如 <code>opcode 15:12</code></div>
      <div><code>名称:位宽</code> 或 <code>名称 位宽</code> 从最高位往下顺排（<code>mode 3</code> = 占 3 位）；单比特写 <code>flag 15:15</code></div>
      <div><code>[ ]</code> 可省略空格；<code>#</code> 开头整行注释；总宽不超过 64 位</div>
    </div>

    <textarea id="spec-text" spellcheck="false" autocomplete="off"
              aria-describedby="spec-help spec-msg"
              placeholder="opcode 15:12"></textarea>

    <div class="spec-schemes">
      <label class="sr-only" for="scheme-select">已保存的方案</label>
      <select id="scheme-select" class="select">
        <option value="">未保存的方案…</option>
      </select>
      <button class="btn" id="scheme-load" type="button" disabled title="把选中方案写入编辑框并应用">载入</button>
      <button class="btn" id="scheme-save" type="button" title="把当前定义保存为命名方案">保存为…</button>
      <button class="btn" id="scheme-del" type="button" disabled title="删除选中方案">删除</button>
    </div>

    <div class="spec-save-name" id="scheme-form" hidden>
      <label class="sr-only" for="scheme-name">方案名</label>
      <input id="scheme-name" type="text" maxlength="24" placeholder="方案名，例如 USB 请求"
             autocomplete="off">
      <button class="btn primary" id="scheme-name-ok" type="button">保存</button>
      <button class="btn" id="scheme-name-cancel" type="button">取消</button>
    </div>

    <div class="spec-actions">
      <span class="spec-msg" id="spec-msg" role="status" aria-live="polite"></span>
      <button class="btn" id="spec-cancel" type="button">取消</button>
      <button class="btn primary" id="spec-save" type="button">应用</button>
    </div>
  </div>

  <div class="fallback">
    <input id="fallback-expr" type="text" spellcheck="false" aria-label="表达式输入"
           placeholder="表达式，例如 12 &lt;&lt; 3、pow(2,10)、0xFF &amp; 0x0F">
  </div>

</div>

<script src="parser.js"></script>
<script src="grid.js"></script>
<script src="proto.js"></script>
<script src="store.js"></script>
<script src="main.js"></script>
</body>
</html>
